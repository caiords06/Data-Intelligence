[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["build", "dist", "release", "storage", "artifacts"]

[tool.ruff.lint]
# O baseline inicial bloqueia erros reais sem impor uma reforma cosmética em
# milhares de linhas legadas. Regras adicionais podem ser ativadas por módulo.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["auth", "core", "enterprise", "servidor_corporativo"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", "release"]
skips = ["B101"]
